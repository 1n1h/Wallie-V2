<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Wallie AI - Your AI Trading Assistant</title>
  <meta name="description" content="Wallie AI is your personal day trading assistant. Get real-time chart analysis, trade signals, market sentiment, and trading education — all powered by AI." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="40x40" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Open Graph (link previews: iMessage, Discord, Slack, Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Wallie AI - Your AI Trading Assistant" />
  <meta property="og:description" content="Real-time chart analysis, trade signals, market sentiment, and trading education — all powered by AI." />
  <meta property="og:image" content="https://wallie-ai-37522.web.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://wallie-ai-37522.web.app" />
  <meta property="og:site_name" content="Wallie AI" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wallie AI - Your AI Trading Assistant" />
  <meta name="twitter:description" content="Real-time chart analysis, trade signals, market sentiment, and trading education — all powered by AI." />
  <meta name="twitter:image" content="https://wallie-ai-37522.web.app/og-image.png" />

  <!-- Theme color -->
  <meta name="theme-color" content="#0057B8" />
  <!-- Theme boot: default to dark before first paint, so [data-theme=dark] styles apply from the start. The app (theme toggle / saved settings) can switch to light after load. -->
  <script>
    if (!document.documentElement.getAttribute('data-theme')) { document.documentElement.setAttribute('data-theme', 'dark'); }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
